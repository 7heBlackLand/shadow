name: Build Shadow Live ISO

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Shadow profile to build"
        required: true
        default: "minimal"
        type: choice
        options:
          - minimal
          - extended
      version:
        description: "Release version tag (leave empty to auto-increment from v0.0.1)"
        required: false
        default: ""
        type: string
  push:
    branches: [main, master]
    paths-ignore: ['README.md', 'LICENSE', '.github/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside a pure Kali environment to avoid dpkg/apt clashes with Ubuntu
    container:
      image: kalilinux/kali-rolling
      options: --privileged
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap kali-archive-keyring xorriso mtools \
            git ca-certificates rsync curl
          which lb && lb --version

      - name: Build Shadow ISO (${{ inputs.profile || 'minimal' }})
        run: |
          chmod +x ./build.sh
          ./build.sh ${{ inputs.profile || 'minimal' }} --verbose

      - name: Verify artifacts
        run: |
          ls -lh images/
          ISO="images/shadow-${{ inputs.profile || 'minimal' }}.iso"
          test -f "$ISO" || { echo "ISO missing!"; exit 1; }
          echo "ISO size: $(du -h "$ISO" | cut -f1)"
          test -f "$ISO.sha256" || { echo "SHA missing!"; exit 1; }
          ( cd images && sha256sum -c "shadow-${{ inputs.profile || 'minimal' }}.iso.sha256" )

      - name: Check ISO size (GitHub caps release assets at 2 GiB)
        id: size
        run: |
          ISO="images/shadow-${{ inputs.profile || 'minimal' }}.iso"
          SIZE=$(stat -c%s "$ISO")
          echo "ISO size bytes: $SIZE"
          if [ "$SIZE" -lt 2147483648 ]; then
            echo "single=true" >> "$GITHUB_OUTPUT"
          else
            echo "single=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Split ISO into <2 GiB parts
        if: steps.size.outputs.single == 'false'
        run: |
          ISO="images/shadow-${{ inputs.profile || 'minimal' }}.iso"
          split -b 1900M "$ISO" "${ISO}.part-"
          echo "# Shadow.iso (${{ inputs.profile || 'minimal' }}) release" > images/RELEASE.md
          echo "" >> images/RELEASE.md
          echo "The ISO is larger than GitHub's 2 GiB per-file release limit, so it is split into multiple parts. Reassemble before use:" >> images/RELEASE.md
          echo "" >> images/RELEASE.md
          echo "    cat shadow-${{ inputs.profile || 'minimal' }}.iso.part-* > shadow-${{ inputs.profile || 'minimal' }}.iso" >> images/RELEASE.md
          echo "    sha256sum -c shadow-${{ inputs.profile || 'minimal' }}.iso.sha256" >> images/RELEASE.md
          echo "" >> images/RELEASE.md
          echo "Then write shadow-${{ inputs.profile || 'minimal' }}.iso to a USB drive and boot." >> images/RELEASE.md
          ls -lh "${ISO}.part-"*

      - name: Single-file release notes
        if: steps.size.outputs.single == 'true'
        run: |
          echo "# Shadow.iso (${{ inputs.profile || 'minimal' }}) release" > images/RELEASE.md
          echo "" >> images/RELEASE.md
          echo "Download shadow-${{ inputs.profile || 'minimal' }}.iso, verify, and write to a USB drive:" >> images/RELEASE.md
          echo "" >> images/RELEASE.md
          echo "    sha256sum -c shadow-${{ inputs.profile || 'minimal' }}.iso.sha256" >> images/RELEASE.md
          echo "Then write shadow-${{ inputs.profile || 'minimal' }}.iso to a USB drive and boot." >> images/RELEASE.md

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            LATEST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -z "$LATEST" ]; then
              TAG="v0.0.1"
            else
              BASE="${LATEST#v}"
              MAJ="$(echo "$BASE" | cut -d. -f1)"
              MIN="$(echo "$BASE" | cut -d. -f2)"
              PAT="$(echo "$BASE" | cut -d. -f3)"
              PAT="$(( ${PAT:-0} + 1 ))"
              TAG="v${MAJ}.${MIN}.${PAT}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $TAG"

      - name: Create GitHub Release (single file)
        if: steps.size.outputs.single == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shadow.iso ${{ inputs.profile || 'minimal' }} - ${{ steps.version.outputs.tag }}
          files: |
            images/shadow-${{ inputs.profile || 'minimal' }}.iso
            images/shadow-${{ inputs.profile || 'minimal' }}.iso.sha256
            images/shadow-${{ inputs.profile || 'minimal' }}.buildinfo.txt
            images/RELEASE.md
          fail_on_unmatched_files: true

      - name: Create GitHub Release (split parts)
        if: steps.size.outputs.single == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shadow.iso ${{ inputs.profile || 'minimal' }} - ${{ steps.version.outputs.tag }}
          files: |
            images/shadow-${{ inputs.profile || 'minimal' }}.iso.part-*
            images/shadow-${{ inputs.profile || 'minimal' }}.iso.sha256
            images/shadow-${{ inputs.profile || 'minimal' }}.buildinfo.txt
            images/RELEASE.md
          fail_on_unmatched_files: true
